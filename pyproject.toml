[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "riichi-ai-research"
version = "0.1.0"
description = "Reproducible local-first Riichi Mahjong AI research"
requires-python = ">=3.11,<3.15"
dependencies = [
  "mahjong==2.0.0",
  "numpy==2.5.4",
  "psutil==7.2.2",
  "riichienv==0.4.10",
  "torch==2.14.1",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[project.scripts]
riichi-ai = "riichi_ai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

